<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoPilot</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-zinc-950 text-zinc-100">
  <div id="loginView" class="min-h-screen grid place-items-center px-4">
    <form id="loginForm" class="w-full max-w-sm border border-zinc-800 bg-zinc-900 p-6 shadow-2xl">
      <div class="mb-6">
        <div class="text-xs uppercase tracking-widest text-cyan-300">AutoPilot</div>
        <h1 class="mt-2 text-2xl font-semibold text-white">Automation control</h1>
      </div>
      <label class="block text-sm text-zinc-300">
        Email
        <input id="email" class="mt-2 w-full border border-zinc-700 bg-zinc-950 px-3 py-2 text-white outline-none focus:border-cyan-400" value="admin@autopilot.local">
      </label>
      <label class="mt-4 block text-sm text-zinc-300">
        Password
        <input id="password" type="password" class="mt-2 w-full border border-zinc-700 bg-zinc-950 px-3 py-2 text-white outline-none focus:border-cyan-400" value="autopilot">
      </label>
      <button class="mt-6 w-full bg-cyan-400 px-4 py-2 font-semibold text-zinc-950 hover:bg-cyan-300" type="submit">Sign in</button>
      <p id="loginError" class="mt-3 min-h-5 text-sm text-red-300"></p>
    </form>
  </div>

  <main id="appView" class="hidden min-h-screen">
    <header class="border-b border-zinc-800 bg-zinc-950/95">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4">
        <div>
          <div class="text-xs uppercase tracking-widest text-cyan-300">AutoPilot</div>
          <h1 class="text-xl font-semibold text-white">Server-side automation</h1>
        </div>
        <div class="flex items-center gap-2">
          <button id="refreshButton" class="border border-zinc-700 px-3 py-2 text-sm text-zinc-200 hover:border-cyan-400">Refresh</button>
          <button id="logoutButton" class="border border-zinc-700 px-3 py-2 text-sm text-zinc-200 hover:border-red-300">Log out</button>
        </div>
      </div>
    </header>

    <div class="mx-auto grid max-w-7xl gap-4 px-5 py-5 lg:grid-cols-[minmax(0,1.2fr)_minmax(360px,0.8fr)]">
      <section class="min-w-0 border border-zinc-800 bg-zinc-900">
        <div class="flex items-center justify-between border-b border-zinc-800 px-4 py-3">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-zinc-300">Tasks</h2>
          <span id="taskCount" class="text-sm text-zinc-500">0</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full min-w-[760px] text-left text-sm">
            <thead class="bg-zinc-950 text-xs uppercase tracking-wider text-zinc-500">
              <tr>
                <th class="px-4 py-3">Name</th>
                <th class="px-4 py-3">Trigger</th>
                <th class="px-4 py-3">Last run</th>
                <th class="px-4 py-3">Next run</th>
                <th class="px-4 py-3">Status</th>
                <th class="px-4 py-3"></th>
              </tr>
            </thead>
            <tbody id="taskRows" class="divide-y divide-zinc-800"></tbody>
          </table>
        </div>
      </section>

      <aside class="grid gap-4">
        <section class="border border-zinc-800 bg-zinc-900">
          <div class="border-b border-zinc-800 px-4 py-3">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-zinc-300">Task detail</h2>
          </div>
          <div id="taskDetail" class="max-h-[520px] overflow-auto p-4 text-sm text-zinc-300"></div>
        </section>

        <section class="border border-zinc-800 bg-zinc-900">
          <div class="border-b border-zinc-800 px-4 py-3">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-zinc-300">Run log</h2>
          </div>
          <pre id="runLog" class="max-h-80 overflow-auto whitespace-pre-wrap p-4 text-xs text-zinc-300"></pre>
        </section>
      </aside>
    </div>

    <section class="mx-auto mb-8 max-w-7xl px-5">
      <form id="taskForm" class="border border-zinc-800 bg-zinc-900">
        <div class="border-b border-zinc-800 px-4 py-3">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-zinc-300">Create task</h2>
        </div>
        <div class="grid gap-4 p-4 lg:grid-cols-4">
          <label class="block text-sm text-zinc-300">
            Name
            <input id="taskName" class="mt-2 w-full border border-zinc-700 bg-zinc-950 px-3 py-2 text-white outline-none focus:border-cyan-400" placeholder="Daily internship monitor">
          </label>
          <label class="block text-sm text-zinc-300 lg:col-span-3">
            Description
            <input id="taskDescription" class="mt-2 w-full border border-zinc-700 bg-zinc-950 px-3 py-2 text-white outline-none focus:border-cyan-400" placeholder="Find new cybersecurity internships and notify me">
          </label>
          <label class="block text-sm text-zinc-300 lg:col-span-2">
            Trigger JSON
            <textarea id="triggerJson" class="mt-2 h-44 w-full border border-zinc-700 bg-zinc-950 p-3 font-mono text-xs text-zinc-100 outline-none focus:border-cyan-400"></textarea>
          </label>
          <label class="block text-sm text-zinc-300 lg:col-span-2">
            Actions JSON
            <textarea id="actionsJson" class="mt-2 h-44 w-full border border-zinc-700 bg-zinc-950 p-3 font-mono text-xs text-zinc-100 outline-none focus:border-cyan-400"></textarea>
          </label>
        </div>
        <div class="flex flex-wrap items-center justify-between gap-3 border-t border-zinc-800 px-4 py-3">
          <div class="flex gap-2">
            <button class="border border-zinc-700 px-3 py-2 text-sm text-zinc-200 hover:border-cyan-400" type="button" data-preset="internship">Internship preset</button>
            <button class="border border-zinc-700 px-3 py-2 text-sm text-zinc-200 hover:border-cyan-400" type="button" data-preset="price">Price preset</button>
          </div>
          <button class="bg-cyan-400 px-4 py-2 font-semibold text-zinc-950 hover:bg-cyan-300" type="submit">Create task</button>
        </div>
        <p id="formError" class="px-4 pb-4 text-sm text-red-300"></p>
      </form>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
