name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    paths:
      - "construction_weighbridge_app/**"
      - ".github/workflows/flutter-apk.yml"

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: construction_weighbridge_app

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: quarry-gate-release-apk
          path: construction_weighbridge_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
