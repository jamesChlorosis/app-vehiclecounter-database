name: construction_weighbridge_app
description: Offline-first weighbridge entry logger for quarry material delivery.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  excel: ^4.0.6
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  google_mlkit_text_recognition: ^0.13.0
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  intl: ^0.19.0
  awesome_snackbar_content: ^0.1.4
  lottie: ^3.1.2
  open_filex: ^4.5.0
  path: ^1.9.0
  path_provider: ^2.1.4
  pdf: ^3.11.1
  permission_handler: ^11.3.1
  printing: ^5.13.2
  provider: ^6.1.2
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  sqflite: ^2.3.3+1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
